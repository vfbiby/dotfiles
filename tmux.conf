# 开启鼠标支持（支持鼠标滚轮滚动查看会话历史、点击切换 panel、拖拽调整大小）
set -g mouse off

# 增加历史回滚行数
#set -g history-limit 50000

# 用 tmux-256color 而不是老的 screen-256color：让 nvim 正确开真彩色
#set -g default-terminal "tmux-256color"
#set -as terminal-overrides ",*:Tc"

# 将状态栏/Tab 栏移动到顶部
set -g status-position top

# 为 macOS 窗口红黄绿三色按钮留出左侧避让空间（避免 Transparent 标题栏下文字重叠）
set -g status-left-length 30
set -g status-left "        [#S] "

# 开启扩展按键(Kitty 键盘协议)支持, 保证 Shift+Enter 等带修饰键的按键透传
# 关键: 外层终端类型是 rio(不是 xterm*), 所以 terminal-features 必须匹配 rio
# extended-keys 用 always 而非 on: Claude Code 在 tmux 里不主动发起协议激活,
# on 等不到查询就不生效, always 直接强制透传
set -s extended-keys always
set -as terminal-features 'rio:extkeys'

# 使用 prefix + h/j/k/l (及大写 H/J/K/L) 移动到 左/下/上/右 panel
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H select-pane -L
bind -r J select-pane -D
bind -r K select-pane -U
bind -r L select-pane -R

# 快捷键 prefix + r 重新加载配置
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
